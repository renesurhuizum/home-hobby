<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brood Bakker - Recepten & Planning</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>🍞 Brood Bakker</h1>
        <p>Vind het perfecte recept en plan je bakdag</p>
    </header>

    <main>
        <!-- Bakgeschiedenis Sectie -->
        <section id="history-section">
            <h2>Recente Baksessies</h2>
            <div id="history-list">
                <!-- Wordt gevuld door JavaScript -->
            </div>
        </section>

        <!-- Ingrediënten Filter Sectie -->
        <section id="filter-section">
            <h2>Wat heb je in huis?</h2>

            <!-- Geavanceerde filters -->
            <div class="advanced-filters">
                <div class="filter-row">
                    <div class="filter-group">
                        <label for="search-input">Zoeken:</label>
                        <input type="text" id="search-input" placeholder="Zoek recept...">
                    </div>
                    <div class="filter-group">
                        <label for="difficulty-filter">Moeilijkheid:</label>
                        <select id="difficulty-filter">
                            <option value="">Alle</option>
                            <option value="Makkelijk">Makkelijk</option>
                            <option value="Gemiddeld">Gemiddeld</option>
                            <option value="Gevorderd">Gevorderd</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="time-filter">Max. tijd:</label>
                        <select id="time-filter">
                            <option value="">Alle</option>
                            <option value="120">< 2 uur</option>
                            <option value="180">< 3 uur</option>
                            <option value="240">< 4 uur</option>
                            <option value="480">< 8 uur</option>
                        </select>
                    </div>
                </div>
                <div class="filter-row">
                    <label class="favorites-toggle">
                        <input type="checkbox" id="favorites-filter">
                        <span>❤️ Alleen favorieten tonen</span>
                    </label>
                </div>
            </div>

            <div id="ingredient-filters">
                <!-- Wordt gevuld door JavaScript -->
            </div>
            <div class="filter-actions">
                <button id="filter-btn" class="btn btn-primary">Toon recepten</button>
                <button id="reset-btn" class="btn btn-secondary">Reset filters</button>
                <button id="random-btn" class="btn btn-accent">🎲 Verras me!</button>
            </div>
        </section>

        <!-- Recepten Overzicht -->
        <section id="recipes-section">
            <h2>Recepten <span id="recipe-count"></span></h2>
            <div id="recipes-grid">
                <!-- Wordt gevuld door JavaScript -->
            </div>
        </section>

        <!-- Recept Detail Modal -->
        <div id="recipe-modal" class="modal hidden">
            <div class="modal-content">
                <button class="close-btn">&times;</button>
                <div id="recipe-detail">
                    <!-- Wordt gevuld door JavaScript -->
                </div>
            </div>
        </div>

        <!-- Planning Sectie -->
        <section id="planning-section" class="hidden">
            <h2>Bak Planning</h2>
            <div class="planning-input">
                <label for="bake-time">Wanneer wil je het brood klaar hebben?</label>
                <input type="datetime-local" id="bake-time">
                <button id="calculate-btn" class="btn btn-primary">Bereken planning</button>
            </div>
            <div id="timeline">
                <!-- Wordt gevuld door JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <p>Brood Bakker - Jouw persoonlijke bak assistent</p>
    </footer>

    <script src="js/recipes.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
